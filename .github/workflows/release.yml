name: Release

# Publishing a GitHub release builds the panel and attaches sailcast.zip,
# which the Marketplace installs.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the manifest version
        run: |
          version="$(jq -r .version custom_components/sailcast/manifest.json)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Zip the integration
        working-directory: custom_components/sailcast
        run: zip -r "$GITHUB_WORKSPACE/sailcast.zip" . -x "__pycache__/*"
      - name: Attach the zip to the release
        run: gh release upload "$GITHUB_REF_NAME" sailcast.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
