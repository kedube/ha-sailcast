# Tool settings only. SailCast isn't a Python package; Home Assistant loads it
# from custom_components/sailcast.

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
  "ASYNC", # async pitfalls
  "B",     # bugbear
  "C4",    # comprehensions
  "D",     # docstrings
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # import order
  "N",     # naming
  "PL",    # pylint
  "PT",    # pytest style
  "PTH",   # pathlib
  "RET",   # returns
  "RUF",   # ruff's own rules
  "S",     # security
  "SIM",   # simplifications
  "UP",    # newer syntax
  "W",     # pycodestyle warnings
]
ignore = [
  "D202",    # blank line after a function docstring
  "D203",    # blank line before a class docstring
  "D213",    # multi-line summary on the second line
  "PLR2004", # magic values in comparisons
  "PLR0913", # many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components.sailcast"]
known-third-party = ["homeassistant", "probatio"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/sailcast"]
strict = true
explicit_package_bases = true
warn_unreachable = true

# Home Assistant exposes names through its packages without re-exporting
# them explicitly, as in `websocket_api.ActiveConnection`.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true
